<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peta Fasilitas Pendidikan — Kota Jambi</title>
    
    <!-- Leaflet CSS (atau CSS Peta lainnya) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        #map {
            width: 100%;
            height: 600px;
            border-radius: 8px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <h2>Peta Fasilitas Pendidikan Kota Jambi</h2>
    <div id="loading" class="loading">Memuat data dari GitHub...</div>
    <div id="map" style="display:none;"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // URL Raw GitHub untuk file GeoJSON kamu
        const URL_KOTA = 'https://raw.githubusercontent.com/MuhammadTaufikkurrahman/MAP_TOPIK/main/kota.geojson';
        const URL_BOUNDARY = 'https://raw.githubusercontent.com/MuhammadTaufikkurrahman/MAP_TOPIK/main/clipping_boundary.geojson';

        async function loadData() {
            try {
                // Fetch data GeoJSON dari GitHub secara paralel
                const [facilitiesData, boundaryData] = await Promise.all([
                    fetch(URL_KOTA).then(res => {
                        if (!res.ok) throw new Error('Gagal memuat data kota');
                        return res.json();
                    }),
                    fetch(URL_BOUNDARY).then(res => {
                        if (!res.ok) throw new Error('Gagal memuat data boundary');
                        return res.json();
                    })
                ]);

                // Sembunyikan pesan loading dan tampilkan peta
                document.getElementById('loading').style.display = 'none';
                document.getElementById('map').style.display = 'block';

                // Inisialisasi peta setelah data selesai di-fetch
                initMap(facilitiesData, boundaryData);

            } catch (error) {
                console.error('Error saat mengambil data GeoJSON:', error);
                document.getElementById('loading').innerText = 'Gagal memuat data dari GitHub. Periksa kembali file/repository.';
            }
        }

        function initMap(facilities, boundary) {
            // 1. Inisialisasi Peta (Koordinat Pusat Kota Jambi)
            const map = L.map('map').setView([-1.610123, 103.613120], 12);

            // 2. Tambahkan Tile Layer (Basemap)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // 3. Tambahkan Layer Clipping Boundary dari GitHub
            if (boundary) {
                L.geoJSON(boundary, {
                    style: {
                        color: '#ff7800',
                        weight: 2,
                        opacity: 0.65
                    }
                }).addTo(map);
            }

            // 4. Tambahkan Layer Fasilitas Kota dari GitHub
            if (facilities) {
                const facilitiesLayer = L.geoJSON(facilities, {
                    onEachFeature: function (feature, layer) {
                        // Tampilkan popup jika ada properti nama
                        if (feature.properties) {
                            let popupContent = '<b>Fasilitas Pendidikan</b><br>';
                            for (let key in feature.properties) {
                                popupContent += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                            }
                            layer.bindPopup(popupContent);
                        }
                    }
                }).addTo(map);

                // Sesuaikan zoom peta ke area data
                map.fitBounds(facilitiesLayer.getBounds());
            }
        }

        // Jalankan fungsi loadData saat halaman dibuka
        loadData();
    </script>
</body>
</html>
