<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Peta Fasilitas Pendidikan — Kota Jambi</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        header h1 { font-size: 1.5rem; font-weight: 700; }
        header p { font-size: 0.875rem; opacity: 0.85; margin-top: 4px; }

        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
            flex: 1;
        }

        .sidebar {
            flex: 1;
            min-width: 280px;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #1e3c72;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .stat-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-item .num { font-size: 1.4rem; font-weight: 700; color: #2a5298; }
        .stat-item .label { font-size: 0.75rem; color: #64748b; }

        .search-box { position: relative; margin-bottom: 4px; }
        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }
        .search-box input:focus { border-color: #2a5298; }
        .search-box i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; font-size: 0.85rem;
        }

        .legend-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .legend-item {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 0.85rem; padding: 8px 10px; border-radius: 8px;
            transition: background 0.2s; cursor: pointer; border: 1px solid transparent;
            user-select: none;
        }
        .legend-item:hover { background: #f1f5f9; }
        .legend-item.off { opacity: 0.4; }
        .legend-badge { display: flex; align-items: center; gap: 10px; }
        .color-circle {
            width: 14px; height: 14px; border-radius: 50%; display: inline-block;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.05); flex-shrink: 0;
        }
        .legend-count {
            background: #eef2f5; color: #475569; font-weight: 600;
            font-size: 0.75rem; padding: 2px 8px; border-radius: 999px;
        }

        .map-wrapper {
            flex: 3;
            min-width: 320px;
            position: relative;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            min-height: 600px;
        }
        #map { width: 100%; height: 100%; min-height: 600px; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 1000; background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-weight: 600; color: #1e3c72;
            display: flex; align-items: center; gap: 12px;
        }

        .leaflet-popup-content-wrapper { border-radius: 10px; padding: 2px; }
        .leaflet-popup-content { margin: 12px 14px; min-width: 220px; }

        .popup-title {
            font-size: 1rem; font-weight: 700; color: #1e3c72;
            padding-bottom: 8px; margin-bottom: 8px;
            border-bottom: 2px solid #2a5298;
        }
        .popup-badge {
            display: inline-block; font-size: 0.7rem; font-weight: 600;
            padding: 2px 9px; border-radius: 999px; color: #fff; margin-bottom: 8px;
        }
        .popup-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .popup-table tr:not(:last-child) th,
        .popup-table tr:not(:last-child) td { border-bottom: 1px solid #eef2f5; }
        .popup-table th, .popup-table td { padding: 6px 4px; text-align: left; vertical-align: top; }
        .popup-table th { color: #64748b; font-weight: 600; width: 42%; white-space: nowrap; }
        .popup-table td { color: #1e293b; }
        .popup-link {
            display: inline-block; margin-top: 10px; font-size: 0.78rem;
            color: #2a5298; text-decoration: none; font-weight: 600;
        }
        .popup-link:hover { text-decoration: underline; }

        @media (max-width: 880px) {
            .sidebar { max-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-map-location-dot"></i> Peta Fasilitas Pendidikan — Kota Jambi</h1>
        <p>Sistem Informasi Geografis berbasis data terbuka GitHub (GeoJSON Dinamis)</p>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="card">
                <h3><i class="fa-solid fa-chart-pie"></i> Ringkasan Data</h3>
                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="num" id="stat-total">0</div>
                        <div class="label">Total Fasilitas</div>
                    </div>
                    <div class="stat-item">
                        <div class="num" id="stat-categories">0</div>
                        <div class="label">Kategori</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-magnifying-glass"></i> Cari Fasilitas</h3>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Ketik nama sekolah, TK, kampus…" autocomplete="off">
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-layer-group"></i> Legenda Kategori</h3>
                <p style="font-size:0.75rem;color:#94a3b8;margin-bottom:10px;">Klik untuk sembunyikan/tampilkan di peta</p>
                <ul class="legend-list" id="legend-list">
                    <li style="color: #888; font-size: 0.85rem;">Memuat legenda...</li>
                </ul>
            </div>
        </div>

        <div class="map-wrapper">
            <div id="loading">
                <i class="fa-solid fa-spinner fa-spin fa-lg"></i> Memuat Data GeoJSON dari GitHub...
            </div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ================= KONFIGURASI SUMBER DATA =================
        const URL_KOTA = 'https://raw.githubusercontent.com/MuhammadTaufikkurrahman/MAP_TOPIK/main/kota.geojson';
        const URL_BOUNDARY = 'https://raw.githubusercontent.com/MuhammadTaufikkurrahman/MAP_TOPIK/main/clipping_boundary.geojson';

        // ================= KAMUS KATEGORI JENJANG (hasil klasifikasi, bukan amenity mentah) =================
        const CATEGORY_META = {
            tk:      { label: 'TK / PAUD',                    color: '#d9668a' },
            sd:      { label: 'SD / Sederajat',                color: '#4fa8e0' },
            smp:     { label: 'SMP / Sederajat',               color: '#e0a83f' },
            sma:     { label: 'SMA–SMK / Sederajat',           color: '#c0392b' },
            kampus:  { label: 'Kampus (Universitas/Akademi)',  color: '#8b7ae0' },
            lainnya: { label: 'Lainnya / Tidak Terklasifikasi', color: '#9a9a86' }
        };

        // Label untuk field "amenity" mentah dari OSM (ditampilkan terpisah di tabel popup)
        const AMENITY_LABELS = {
            school: 'Sekolah (data OSM)',
            kindergarten: 'TK / PAUD (data OSM)',
            college: 'Akademi / Politeknik (data OSM)',
            university: 'Universitas / Institut (data OSM)'
        };

        // Kata kunci awalan nama untuk menebak jenjang saat amenity & isced_level kosong/ambigu
        const NAME_HINTS = {
            kampus: ['universitas','akademi','politeknik','poltekkes','institut','stikom','stie','stmik','sekolah tinggi','akbid','akper','fakultas'],
            tk:     ['tk ','tk-','tk/','paud','kelompok bermain','playgroup','play group','kinderfield','kindergarten'],
            sma:    ['sma','smk','man ','man,','mas ','madrasah aliyah'],
            smp:    ['smp','mts','madrasah tsanawiyah'],
            sd:     ['sd ','sdn','sdit','sd-','sd/','mis ','min ','mi ','madrasah ibtidaiyah']
        };

        function guessCategoryFromName(name) {
            const n = (name || '').toLowerCase().trim() + ' ';
            for (const cat of ['kampus','tk','sma','smp','sd']) {
                if (NAME_HINTS[cat].some(kw => n.startsWith(kw))) return cat;
            }
            return null;
        }

        // Fungsi utama klasifikasi jenjang: amenity -> isced_level -> tebakan nama -> lainnya
        function classifyFacility(props) {
            if (props.amenity === 'kindergarten') return 'tk';
            if (props.amenity === 'university' || props.amenity === 'college') return 'kampus';

            const isced = props.isced_level;
            if (isced === '0') return 'tk';
            if (isced === '1') return 'sd';
            if (isced === '2') return 'smp';
            if (isced === '3') return 'sma';
            if (isced === '4') return 'kampus';

            const guessed = guessCategoryFromName(props.name);
            if (guessed) return guessed;

            return 'lainnya';
        }

        // ================= KAMUS JENJANG ISCED =================
        const ISCED_META = {
            '0': 'ISCED 0 · PAUD / Pra-sekolah',
            '1': 'ISCED 1 · Sekolah Dasar',
            '2': 'ISCED 2 · SMP / sederajat',
            '3': 'ISCED 3 · SMA–SMK / sederajat',
            '4': 'ISCED 4 · Pasca-menengah',
            '0;1;2;3': 'ISCED 0–3 · Multi-jenjang'
        };

        // Label properti mentah -> label yang enak dibaca (yang tidak ada di sini akan pakai nama aslinya)
        const FIELD_LABELS = {
            name: 'Nama',
            amenity: 'Kategori',
            isced_level: 'Jenjang Pendidikan',
            kecamatan: 'Kecamatan',
            capacity: 'Kapasitas',
            area_m2: 'Luas'
        };

        // Properti yang tidak perlu ditampilkan di tabel popup
        const HIDDEN_FIELDS = new Set(['osm_id', 'osm_type', 'centroid']);

        const categoryLayerGroups = {};   // { kategori: L.layerGroup }
        const categoryCounts = {};        // { kategori: jumlah }
        const allMarkersMeta = [];        // untuk fitur pencarian: { layer, category, name }
        const activeCategories = new Set();
        let searchTerm = '';

        function createCustomIcon(color) {
            const svgIcon = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color}" width="28px" height="28px" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.35));">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>`;
            return L.divIcon({
                html: svgIcon, className: '',
                iconSize: [28, 28], iconAnchor: [14, 28], popupAnchor: [0, -26]
            });
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function formatArea(m2) {
            if (m2 === null || m2 === undefined) return null;
            return m2 >= 10000 ? (m2 / 10000).toFixed(2) + ' ha' : Math.round(m2) + ' m²';
        }

        function osmTypeToPath(osmType) {
            if (osmType === 'nodes') return 'node';
            if (osmType === 'ways_poly' || osmType === 'ways') return 'way';
            if (osmType === 'relations') return 'relation';
            return null;
        }

        // Mengubah nilai properti mentah jadi teks yang enak dibaca, atau null jika harus disembunyikan
        function formatValue(key, value) {
            if (value === null || value === undefined || value === '') return null;
            if (key === 'amenity') {
                return AMENITY_LABELS[value] || value;
            }
            if (key === 'isced_level') {
                return ISCED_META[value] || ('ISCED ' + value);
            }
            if (key === 'area_m2') {
                return formatArea(value);
            }
            return value;
        }

        async function loadData() {
            try {
                const [facilitiesData, boundaryData] = await Promise.all([
                    fetch(URL_KOTA).then(res => {
                        if (!res.ok) throw new Error('Gagal mengambil data kota.geojson');
                        return res.json();
                    }),
                    fetch(URL_BOUNDARY).then(res => {
                        if (!res.ok) throw new Error('Gagal mengambil data clipping_boundary.geojson');
                        return res.json();
                    }).catch(() => null)
                ]);

                document.getElementById('loading').style.display = 'none';
                initMap(facilitiesData, boundaryData);

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = `
                    <span style="color: #e74c3c;">
                        <i class="fa-solid fa-triangle-exclamation"></i> Gagal memuat data dari GitHub.
                    </span>`;
            }
        }

        let map;

        function initMap(facilities, boundary) {
            map = L.map('map').setView([-1.610123, 103.613120], 12);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            if (boundary) {
                L.geoJSON(boundary, {
                    style: {
                        color: '#2a5298', weight: 2, dashArray: '5, 5',
                        fillColor: '#2a5298', fillOpacity: 0.05
                    },
                    interactive: false
                }).addTo(map);
            }

            let totalFeatures = 0;
            const allBoundsLayer = L.featureGroup();

            if (facilities && facilities.features) {
                totalFeatures = facilities.features.length;

                // siapkan layer group kosong per kategori
                Object.keys(CATEGORY_META).forEach(key => {
                    categoryLayerGroups[key] = L.layerGroup();
                    categoryCounts[key] = 0;
                    activeCategories.add(key);
                });

                facilities.features.forEach(feature => {
                    const props = feature.properties || {};
                    const catKey = classifyFacility(props);
                    const color = CATEGORY_META[catKey].color;
                    categoryCounts[catKey]++;

                    // Ambil koordinat titik: centroid -> geometry Point -> titik pertama poligon (fallback terakhir)
                    let lat, lon;
                    if (Array.isArray(props.centroid) && props.centroid.length === 2) {
                        lon = props.centroid[0]; lat = props.centroid[1];
                    } else if (feature.geometry && feature.geometry.type === 'Point') {
                        lon = feature.geometry.coordinates[0]; lat = feature.geometry.coordinates[1];
                    } else if (feature.geometry && feature.geometry.type === 'Polygon') {
                        const ring = feature.geometry.coordinates[0];
                        lon = ring[0][0]; lat = ring[0][1];
                    } else {
                        categoryCounts[catKey]--;
                        return; // benar-benar tidak ada koordinat sama sekali
                    }

                    const marker = L.marker([lat, lon], { icon: createCustomIcon(color) });

                    // Susun tabel popup: hanya properti yang punya nilai (bukan null)
                    const title = props.name || 'Fasilitas Pendidikan';
                    let tableRows = '';
                    for (const key in props) {
                        if (HIDDEN_FIELDS.has(key)) continue;
                        if (key === 'name') continue; // sudah jadi judul
                        const displayVal = formatValue(key, props[key]);
                        if (displayVal === null) continue; // sembunyikan null
                        const label = FIELD_LABELS[key] || key;
                        tableRows += `<tr><th>${escapeHtml(label)}</th><td>${escapeHtml(displayVal)}</td></tr>`;
                    }

                    let osmLink = '';
                    const osmPath = osmTypeToPath(props.osm_type);
                    if (osmPath && props.osm_id) {
                        osmLink = `<a class="popup-link" href="https://www.openstreetmap.org/${osmPath}/${props.osm_id}" target="_blank" rel="noopener">Buka di OpenStreetMap ↗</a>`;
                    }

                    const popupContent = `
                        <div class="popup-badge" style="background:${color}">${CATEGORY_META[catKey].label}</div>
                        <div class="popup-title">${escapeHtml(title)}</div>
                        <table class="popup-table">${tableRows}</table>
                        ${osmLink}
                    `;
                    marker.bindPopup(popupContent);

                    categoryLayerGroups[catKey].addLayer(marker);
                    allBoundsLayer.addLayer(marker);
                    allMarkersMeta.push({ layer: marker, category: catKey, name: title.toLowerCase() });
                });

                // tambahkan semua layer group ke peta (semua kategori aktif di awal)
                Object.values(categoryLayerGroups).forEach(lg => lg.addTo(map));

                if (allBoundsLayer.getLayers().length && allBoundsLayer.getBounds().isValid()) {
                    map.fitBounds(allBoundsLayer.getBounds(), { padding: [30, 30] });
                }
            }

            updateDashboardUI(totalFeatures);
            applyFilters();
        }

        function updateDashboardUI(totalCount) {
            document.getElementById('stat-total').innerText = totalCount;
            const usedCategories = Object.keys(CATEGORY_META).filter(k => categoryCounts[k] > 0);
            document.getElementById('stat-categories').innerText = usedCategories.length;

            const legendList = document.getElementById('legend-list');
            legendList.innerHTML = '';

            usedCategories.forEach(key => {
                const meta = CATEGORY_META[key];
                const count = categoryCounts[key];
                const li = document.createElement('li');
                li.className = 'legend-item';
                li.dataset.key = key;
                li.innerHTML = `
                    <div class="legend-badge">
                        <span class="color-circle" style="background-color: ${meta.color};"></span>
                        <span>${escapeHtml(meta.label)}</span>
                    </div>
                    <span class="legend-count">${count}</span>
                `;
                li.addEventListener('click', () => toggleCategory(key, li));
                legendList.appendChild(li);
            });
        }

        function toggleCategory(key, li) {
            if (activeCategories.has(key)) {
                activeCategories.delete(key);
                li.classList.add('off');
            } else {
                activeCategories.add(key);
                li.classList.remove('off');
            }
            applyFilters();
        }

        function applyFilters() {
            allMarkersMeta.forEach(m => {
                const catActive = activeCategories.has(m.category);
                const matchesSearch = !searchTerm || m.name.includes(searchTerm);
                const shouldShow = catActive && matchesSearch;
                const group = categoryLayerGroups[m.category];
                if (shouldShow) {
                    if (!group.hasLayer(m.layer)) group.addLayer(m.layer);
                } else {
                    if (group.hasLayer(m.layer)) group.removeLayer(m.layer);
                }
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchTerm = e.target.value.trim().toLowerCase();
            applyFilters();
        });

        loadData();
    </script>
</body>
</html>
